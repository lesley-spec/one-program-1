name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Publish standalone wireframes
        run: |
          # Static HTML prototypes live at the repo root and are reachable
          # at e.g. /affiliate-creator-manager-wireframe.html on Pages.
          cp affiliate-creator-manager-wireframe.html dist/ || true
          cp affiliate-creator-manager-personas.html dist/ || true
          cp affiliate-creator-manager-prd.md dist/ || true
          cp dashboard2.html dist/ || true
          cp nextGenDash.html dist/ || true
          cp persona-nav-prototypes.html dist/ || true
          cp personas.html dist/ || true
          # Shared static assets the wireframes reference (logo, etc.).
          # Vite's build also writes to dist/assets/ with hashed filenames,
          # so this merge is collision-free.
          mkdir -p dist/assets
          cp -R assets/. dist/assets/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
